# Netlify build for the Next.js web app. The site's base directory is `web/`,
# so paths here are relative to it. The Next.js runtime turns the `.next`
# build output into the server function and routing rules; without it the
# source tree is published as static files and every route 404s.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
